name: Android widget debug build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vachnamrut-swamini-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vachnamrut-swamini-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Build ARM64 debug APK with widget resources
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: vachnamrut-swamini-mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: vach-android-arm64-debug
          path: vachnamrut-swamini-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
